networks:
    app_network:

volumes:
    pg_data:

services:
    web:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        environment: 
            - TZ=America/Fortaleza
            - CURL_IPRESOLVE=1
        sysctls:
            - net.ipv6.conf.all.disable_ipv6=1
            - net.ipv6.conf.default.disable_ipv6=1

        command: sh -c "service cron start && apache2-foreground"
        ports:
            - 80:80
        volumes:
            - ./:/var/www/html        
        dns:
            - 8.8.8.8
            - 1.1.1.1
        networks:
            - app_network

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
        - '1025:1025'
        - '8025:8025'
        networks:
            - app_network

    db:
        image: postgres
        ports:
            - 5432:5432
        volumes:
            - pg_data:/var/lib/postgresql
        environment:
            POSTGRES_DB: backups_polo
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        networks:
            - app_network

